<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="KS금성 로고">
  <defs>
    <linearGradient id="ksGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e89a"/>
      <stop offset="38%" stop-color="#e3c156"/>
      <stop offset="62%" stop-color="#c99a2e"/>
      <stop offset="100%" stop-color="#9c7416"/>
    </linearGradient>
    <linearGradient id="ksBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ksSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#ksBadge)"/>
  <!-- Gold inner frame -->
  <rect x="9.5" y="9.5" width="81" height="81" rx="17" fill="none" stroke="url(#ksGold)" stroke-width="1.6" opacity="0.9"/>
  <!-- Top sheen -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#ksSheen)"/>

  <!-- KS monogram (serif) -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="52" letter-spacing="-3"
        fill="url(#ksGold)">KS</text>
</svg>
