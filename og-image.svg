<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4fa5"/>
      <stop offset="50%" stop-color="#2670cf"/>
      <stop offset="100%" stop-color="#3d8ee0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0%" stop-color="#f5b378" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5b378" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf2fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe6a8"/>
      <stop offset="50%" stop-color="#f5b378"/>
      <stop offset="100%" stop-color="#ffd89a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative rings -->
  <circle cx="1100" cy="100" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="80" cy="560" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- KS Logo Mark -->
  <g transform="translate(100, 130)">
    <rect width="120" height="120" rx="28" fill="url(#mark)" opacity="0.95"/>
    <text x="60" y="82" font-family="Pretendard, system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" fill="#1e5fbe" letter-spacing="-2">KS</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(100, 290)">
    <rect width="350" height="42" rx="21" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="22" cy="21" r="4" fill="#f5b378"/>
    <text x="38" y="27" font-family="Pretendard, system-ui, sans-serif" font-weight="500" font-size="16" fill="#ffffff" letter-spacing="0.3">동탄·용인·화성·오산·수원 포장이사 전문</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="400" font-family="Pretendard, system-ui, sans-serif" font-weight="900" font-size="62" fill="#ffffff" letter-spacing="-2.5">
    행복을 옮겨드리는
  </text>
  <text x="100" y="475" font-family="Pretendard, system-ui, sans-serif" font-weight="900" font-size="62" fill="url(#accent)" letter-spacing="-2.5">
    정확한 이사 서비스
  </text>

  <!-- Sub -->
  <text x="100" y="530" font-family="Pretendard, system-ui, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.92" letter-spacing="-0.5">
    100% 한국인 베테랑 직원 · 가족 운영 · 분실·파손 ZERO 시스템
  </text>

  <!-- Phone -->
  <g transform="translate(100, 555)">
    <rect width="320" height="48" rx="24" fill="#e89348"/>
    <text x="160" y="32" font-family="Pretendard, system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">📞 010-8362-0024</text>
  </g>

  <!-- Brand on right -->
  <g transform="translate(820, 145)">
    <text x="280" y="0" font-family="Pretendard, system-ui, sans-serif" font-weight="900" font-size="36" text-anchor="end" fill="#ffffff" letter-spacing="-0.5">KS금성익스프레스</text>
    <text x="280" y="38" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="600" font-size="20" text-anchor="end" fill="#ffffff" fill-opacity="0.7" letter-spacing="3">KS GEUMSEONG EXPRESS</text>
  </g>
</svg>
