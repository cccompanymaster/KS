<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f7f9"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e89a"/>
      <stop offset="38%" stop-color="#e3c156"/>
      <stop offset="62%" stop-color="#c99a2e"/>
      <stop offset="100%" stop-color="#9c7416"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Centered logo group -->
  <g transform="translate(600, 315)">
    <!-- Badge -->
    <g filter="url(#shadow)">
      <rect x="-120" y="-200" width="240" height="240" rx="52" fill="url(#badge)"/>
      <rect x="-108" y="-188" width="216" height="216" rx="44" fill="none" stroke="url(#gold)" stroke-width="3.2" opacity="0.92"/>
      <rect x="-120" y="-200" width="240" height="240" rx="52" fill="url(#sheen)"/>
      <text x="0" y="-72" text-anchor="middle" dominant-baseline="central"
            font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
            font-weight="700" font-size="138" letter-spacing="-8"
            fill="url(#gold)">KS</text>
    </g>

    <!-- Wordmark -->
    <text x="0" y="92" text-anchor="middle"
          font-family="Pretendard, 'Noto Sans KR', system-ui, sans-serif"
          font-weight="900" font-size="58" letter-spacing="-2.5"
          fill="#111111">KS금성익스프레스</text>

    <!-- English subtitle -->
    <text x="0" y="148" text-anchor="middle"
          font-family="'Cormorant Garamond', Georgia, serif"
          font-style="italic" font-weight="600" font-size="28"
          letter-spacing="6" fill="#8a7a4a">KS GEUMSEONG EXPRESS</text>

    <!-- Tagline -->
    <text x="0" y="198" text-anchor="middle"
          font-family="Pretendard, 'Noto Sans KR', system-ui, sans-serif"
          font-weight="500" font-size="22" letter-spacing="0.04em"
          fill="#5b6470">행복을 옮겨드리는 정확한 이사 서비스</text>
  </g>
</svg>
